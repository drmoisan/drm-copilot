[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "drm-copilot-discovery"
version = "2.0.0"
description = "Local, domain-neutral legacy discovery and parity artifact tooling."
authors = ["Dan Moisan"]
license = "MIT"
readme = "README.md"
packages = [{ include = "drm_copilot_discovery", from = "src" }]
include = ["src/drm_copilot_discovery/py.typed"]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
PyYAML = ">=6.0"
jsonschema = "^4.25.1"
referencing = ">=0.37,<0.38"
lxml = ">=5.3.0"
