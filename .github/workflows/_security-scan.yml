name: Security Scan (reusable)

on:
  workflow_call:
    inputs:
      run-heavy:
        description: "Run the heavy steps. ci.yml passes false only for a docs-only change scope."
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      run-heavy:
        description: "Run the heavy steps. ci.yml passes false only for a docs-only change scope."
        required: false
        type: boolean
        default: true

jobs:
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        if: ${{ inputs.run-heavy }}
        uses: actions/checkout@v7

      - name: Set up Python
        if: ${{ inputs.run-heavy }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Poetry
        if: ${{ inputs.run-heavy }}
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install the Poetry export plugin
        if: ${{ inputs.run-heavy }}
        run: poetry self add poetry-plugin-export

      - name: Check for security vulnerabilities
        if: ${{ inputs.run-heavy }}
        shell: bash
        run: |
          poetry run pip install safety
          poetry export -f requirements.txt --without-hashes | poetry run safety check --stdin
