name: Quality Checks (reusable)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality-checks7:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Verify poetry.lock is in sync
        run: |
          poetry check --lock
          if ! git diff --exit-code poetry.lock; then
            echo "ERROR: poetry.lock is out of sync with pyproject.toml"
            echo "Run 'poetry lock --no-update' locally and commit the changes"
            exit 1
          fi

      - name: Check formatting with Black
        run: |
          poetry run black --check .
        continue-on-error: false

      - name: Lint with Ruff
        run: |
          poetry run ruff check
        continue-on-error: false

      - name: Type check with Pyright
        run: |
          poetry run pyright
        continue-on-error: false

      - name: Verify Codex agent deployment profiles
        run: |
          poetry run python -m scripts.dev_tools.generate_codex_agent_variants --check
        continue-on-error: false

      - name: Run tests with Pytest
        run: |
          poetry run pytest --cov=src/lexile_corpus_tuner --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
