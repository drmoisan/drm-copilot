[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "drm-copilot"
version = "0.1.1"
description = "Tool for optimizing use of copilot and streamlining documentation."
authors = ["Dan Moisan"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "scripts" },
]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
drm-copilot-discovery = { path = "packages/discovery-runtime", develop = true }
typer = ">=0.9.0"
PyYAML = ">=6.0"
numpy = ">=1.23"
click = ">=8.1"
pandas = ">=2.0"
scikit-learn = ">=1.3"
scipy = ">=1.10"
requests = ">=2.31"
beautifulsoup4 = ">=4.12"
lxml = ">=5.3.0"
pyarrow = ">=15.0"
pdfplumber = ">=0.10.0"
tensorflow = { version = ">=2.10.0", optional = true }
joblib = { version = ">=1.1.0", optional = true }
nltk = { version = ">=3.8", optional = true }
keras-preprocessing = { version = ">=1.1", optional = true }
openai = { version = ">=1.40.0", optional = true }

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=7.0"
black = ">=23.0"
ruff = ">=0.5.3"
pyright = ">=1.1.407"
pyperclip = "^1.11.0"
jsonschema = "^4.25.1"
types-beautifulsoup4 = ">=4.12.0.0"
types-requests = ">=2.31.0.6"

[tool.poetry.scripts]
atomic-executor = "scripts.dev_tools.atomic_executor.cli:main"
codex-native-converter = "scripts.dev_tools.codex_native_converter.cli:main"

# Dev Tools Aliases
"dev.atomic-executor" = "scripts.dev_tools.atomic_executor.cli:main"
"dev.clean-devcontainer" = "scripts.dev_tools.clean_devcontainer:main"
"dev.collect-commit-context" = "scripts.dev_tools.collect_commit_context:main"
"dev.discovery.init" = "drm_copilot_discovery.cli:main_init"
"dev.discovery.configure" = "drm_copilot_discovery.cli:main_configure"
"dev.discovery.profile" = "drm_copilot_discovery.cli:main_profile"
"dev.discovery.inventory" = "drm_copilot_discovery.cli:main_inventory"
"dev.discovery.dotnet" = "drm_copilot_discovery.cli:main_dotnet"
"dev.discovery.vsto" = "drm_copilot_discovery.cli:main_vsto"
"dev.discovery.new-contract" = "drm_copilot_discovery.cli:main_new_contract"
"dev.discovery.new-scenario" = "drm_copilot_discovery.cli:main_new_scenario"
"dev.discovery.update-artifact" = "drm_copilot_discovery.cli:main_update_artifact"
"dev.discovery.link-evidence" = "drm_copilot_discovery.cli:main_link_evidence"
"dev.discovery.validate-profile" = "drm_copilot_discovery.cli:main_validate_profile"
"dev.discovery.validate-feature-contract" = "drm_copilot_discovery.cli:main_validate_feature_contract"
"dev.discovery.validate-coverage-ledger" = "drm_copilot_discovery.cli:main_validate_coverage_ledger"
"dev.discovery.validate-runtime-scenario" = "drm_copilot_discovery.cli:main_validate_runtime_scenario"
"dev.discovery.validate-parity-matrix" = "drm_copilot_discovery.cli:main_validate_parity_matrix"
"dev.discovery.validate-unspecified-behavior" = "drm_copilot_discovery.cli:main_validate_unspecified_behavior"
"dev.discovery.validate-product-decision" = "drm_copilot_discovery.cli:main_validate_product_decision"
"dev.discovery.validate-evidence-reference" = "drm_copilot_discovery.cli:main_validate_evidence_reference"
"dev.discovery.validate-decisions" = "drm_copilot_discovery.cli:main_validate_decisions"
"dev.discovery.validate-all" = "drm_copilot_discovery.cli:main_validate_all"
"dev.discovery.validate" = "drm_copilot_discovery.cli:main_validate"
"dev.discovery.coverage-report" = "drm_copilot_discovery.cli:main_coverage_report"
"dev.discovery.parity-report" = "drm_copilot_discovery.cli:main_parity_report"
"dev.discovery.completion-report" = "drm_copilot_discovery.cli:main_completion_report"
"dev.discovery.generate-acceptance" = "drm_copilot_discovery.cli:main_generate_acceptance"
"dev.discovery.generate-acceptance-scenarios" = "drm_copilot_discovery.cli:main_generate_acceptance_scenarios"
"dev.discovery.snapshot-export" = "drm_copilot_discovery.cli:main_snapshot_export"
"dev.discovery.snapshot-import" = "drm_copilot_discovery.cli:main_snapshot_import"
"dev.discovery.import-inventory" = "drm_copilot_discovery.cli:main_import_inventory"
"dev.discovery.migrate" = "drm_copilot_discovery.cli:main_migrate"
"dev.discovery.doctor" = "drm_copilot_discovery.cli:main_doctor"
"dev.fix-all" = "scripts.dev_tools.fix_all:main"
"dev.format-json" = "scripts.dev_tools.format_json:main"
"dev.format-markdown" = "scripts.dev_tools.markdown_label_formatter:main"
"dev.new-active-feature" = "scripts.dev_tools.new_active_feature_folder:main"
"dev.new-potential-bug" = "scripts.dev_tools.new_potential_bug_entry:main"
"dev.potential-to-issue" = "scripts.dev_tools.potential_to_issue:main"
"dev.pr-context" = "scripts.dev_tools.pr_context.collector:main"
"dev.resolve-execute-plan" = "scripts.dev_tools.resolve_execute_plan_prompt:main"
"dev.resolve-file-prompt" = "scripts.dev_tools.resolve_file_prompt:main"
"dev.validate-json" = "scripts.dev_tools.validate_json:main"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"
show-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]
"src/lexile_corpus_tuner/cli.py" = ["B008"]
# Seeded `random.Random` generation is mandated by `.claude/rules/general-unit-test.md` section Determinism Infrastructure and by `docs/features/active/2026-08-07-parallel-mutation-protocol-442/spec.md` section Constraints & Risks item 2.
"tests/scripts/dev_tools/test_parallel_mutation_protocol_properties.py" = ["S311"]
"tests/scripts/dev_tools/test_parallel_mutation_contention_properties.py" = ["S311"]
"tests/scripts/dev_tools/test_parallel_mutation_pin_stability_properties.py" = ["S311"]
"tests/scripts/dev_tools/test_push_down_exclusion_manifest.py" = ["S311"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --cov-report=lcov:artifacts/python/lcov.info"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src", "scripts/dev_tools", "packages/discovery-runtime/src"]
data_file = "artifacts/.coverage"
omit = [
    "tests/*",
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "^\\s*\\.\\.\\.\\s*$",
]
partial_also = ["^\\s*(async\\s+)?def\\s.*:\\s*\\.\\.\\.\\s*(#.*)?$"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeArgument = "error"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = [
    "scripts",
    "src",
    "packages/discovery-runtime/src",
    "tests"
]
exclude = [
  "**/__pycache__",
  ".idea",
  ".ruff_cache",
  ".venv",
    "drm-copilot",
  "build",
    "dist",
    "node_modules"
]




