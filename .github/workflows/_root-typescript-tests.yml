name: Root TypeScript Tests (reusable)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  root-typescript-tests:
    name: Root TypeScript Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Run root TypeScript toolchain and jest suite
        run: npm test
